<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="title desc">
<title id="title">Water molecule</title><desc id="desc">Schematic with one oxygen atom bonded to two hydrogen atoms at approximately 104.5 degrees.</desc>
<defs><radialGradient id="bg"><stop stop-color="#12334a"/><stop offset="1" stop-color="#07111d"/></radialGradient><radialGradient id="oxygen"><stop stop-color="#ec866c"/><stop offset="1" stop-color="#a94240"/></radialGradient><radialGradient id="hydrogen"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#a6c4d4"/></radialGradient></defs>
<rect width="840" height="520" fill="url(#bg)"/><text x="45" y="62" fill="#9ac7d5" font-family="monospace" font-size="13" letter-spacing="3">CENTAURI ARCHIVE / 02 — MATTER</text>
<text x="45" y="110" fill="#f1f6fa" font-family="Georgia,serif" font-size="49">Water. H₂O.</text>
<text x="45" y="144" fill="#b4cbd9" font-family="sans-serif" font-size="16">Two hydrogen atoms, one oxygen atom.</text>
<g stroke="#cce0e9" stroke-width="17" stroke-linecap="round"><path d="M416 282L312 350"/><path d="M416 282L518 350"/></g>
<circle cx="416" cy="275" r="74" fill="url(#oxygen)" stroke="#e99088" stroke-width="3"/>
<circle cx="290" cy="365" r="52" fill="url(#hydrogen)" stroke="#d8e4ee" stroke-width="2"/>
<circle cx="540" cy="365" r="52" fill="url(#hydrogen)" stroke="#d8e4ee" stroke-width="2"/>
<text x="416" y="288" fill="#fff5eb" font-size="40" font-family="sans-serif" text-anchor="middle">O</text>
<text x="290" y="377" fill="#17364c" font-size="32" font-family="sans-serif" text-anchor="middle">H</text>
<text x="540" y="377" fill="#17364c" font-size="32" font-family="sans-serif" text-anchor="middle">H</text>
<path d="M378 338Q416 362 454 338" stroke="#8bc8df" fill="none" stroke-width="2" stroke-dasharray="4 4"/>
<text x="416" y="388" fill="#c6d8e5" font-family="monospace" font-size="13" text-anchor="middle">≈ 104.5°</text>
<path d="M45 446H795" stroke="#466074"/><text x="45" y="472" fill="#9bb2c5" font-family="monospace" font-size="11" letter-spacing="1">SCHEMATIC · NOT TO SCALE · ORIGINAL EDUCATIONAL DIAGRAM</text>
</svg>